		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>
			<!-- Lightbox para ampliar imágenes -->
			<div id="lightbox" class="lightbox">
				<img id="lightbox-img" src="" alt="" />
			</div>
			<script>
				const galleryTitles = [
					"Titulo 1 PRuebas 2025.", "Artwork 2", "Artwork 3", "Artwork 4", "Artwork 5",
					"Artwork 6", "Artwork 7", "Artwork 8", "Artwork 9", "Artwork 10",
					"Artwork 11", "Artwork 12", "Artwork 13", "Artwork 14", "Artwork 15",
					"Artwork 16", "Artwork 17", "Artwork 18", "Artwork 19", "Artwork 20",
					"Artwork 21", "Artwork 22", "Artwork 23", "Artwork 24", "Artwork 25",
					"Artwork 26", "Artwork 27", "Artwork 28", "Artwork 29", "Artwork 30"
				];
				const galleryYear = [
					"2025", "Artwork 2", "Artwork 3", "Artwork 4", "Artwork 5",
					"Artwork 6", "Artwork 7", "Artwork 8", "Artwork 9", "Artwork 10",
					"Artwork 11", "Artwork 12", "Artwork 13", "Artwork 14", "Artwork 15",
					"Artwork 16", "Artwork 17", "Artwork 18", "Artwork 19", "Artwork 20",
					"Artwork 21", "Artwork 22", "Artwork 23", "Artwork 24", "Artwork 25",
					"Artwork 26", "Artwork 27", "Artwork 28", "Artwork 29", "Artwork 30"
				]
				const galleryMaterial = [
					"PINTURILLAS", "Artwork 2", "Artwork 3", "Artwork 4", "Artwork 5",
					"Artwork 6", "Artwork 7", "Artwork 8", "Artwork 9", "Artwork 10",
					"Artwork 11", "Artwork 12", "Artwork 13", "Artwork 14", "Artwork 15",
					"Artwork 16", "Artwork 17", "Artwork 18", "Artwork 19", "Artwork 20",
					"Artwork 21", "Artwork 22", "Artwork 23", "Artwork 24", "Artwork 25",
					"Artwork 26", "Artwork 27", "Artwork 28", "Artwork 29", "Artwork 30"
				]

				const grid = document.getElementById("gallery-grid");
	const lightbox = document.getElementById("lightbox");
				const lightboxImg = document.getElementById("lightbox-img");

				// Observador para animar cada cuadrado al entrar en pantalla
				const observer = new IntersectionObserver((entries, obs) => {
					entries.forEach((entry) => {
						if (entry.isIntersecting) {
							entry.target.classList.add("visible");
							obs.unobserve(entry.target); // Solo se anima una vez
						}
					});
				}, { threshold: 0.1 });

				galleryTitles.forEach((title, index) => {
					const num = index + 1;
					const imgSrc = `images/gallery/galeria${num}.jpg`;
					const material = galleryMaterial[index] || "";
					const year = galleryYear[index] ? `(${galleryYear[index]})` : "";
					const subtitle = `${material} ${year}`.trim();

					const item = document.createElement("div");
					item.className = "gallery-item";
					// Pequeño retardo escalonado por columna (0s, 0.1s, 0.2s)
					item.style.transitionDelay = `${(index % 3) * 0.1}s`;

					item.innerHTML = `
						<img src="${imgSrc}" alt="${title}" loading="lazy" />
						<div class="gallery-overlay">
							<h3>${title}</h3>
							${subtitle ? `<p>${subtitle}</p>` : ""}
						</div>
					`;

					// Efecto fade-in al terminar de cargar la imagen
					const img = item.querySelector("img");
					if (img.complete) {
						img.classList.add("loaded");
					} else {
						img.addEventListener("load", () => img.classList.add("loaded"));
					}

					// Abrir imagen en grande al hacer clic
					item.addEventListener("click", () => {
						lightboxImg.src = imgSrc;
						lightboxImg.alt = title;
						lightbox.classList.add("active");
					});

					grid.appendChild(item);
					observer.observe(item);
				});

				// Cerrar al hacer clic fuera de la imagen (o en el fondo oscuro)
				lightbox.addEventListener("click", (e) => {
					if (e.target === lightbox) {
						lightbox.classList.remove("active");
					}
				});

				// Cerrar con la tecla Escape
				document.addEventListener("keydown", (e) => {
					if (e.key === "Escape") {
						lightbox.classList.remove("active");
					}
				});
			</script>
	</body>
</html>
